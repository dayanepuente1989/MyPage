# ---------------------------------------------------------------------
#  About
# ---------------------------------------------------------------------
about:
  kicker: { en: "About", es: "Sobre mí" }
  title:
    en: "Ornithologist, bioacoustician, *night listener*"
    es: "Ornitóloga que *escucha la noche*"
  # Paragraphs: leave an empty line between them.
  bio:
    en: |
      I’m a PhD candidate in Conservation and Sustainable Use of Natural Resources at the Instituto Politécnico Nacional (CIIDIR Unidad Oaxaca), where I work in the **Laboratory of Bioacoustics and Behavioral Ecology**. My research brings together ornithology, bioacoustics and wildlife management: I use bird vocalizations to understand how nocturnal birds behave across mountain landscapes, and I study the relationship between wild birds and the farmers whose crops they feed on.

      My path began in agroecology, continued through wildlife management on the coast of Oaxaca, and now centres on nightjars, a group of cryptic nocturnal birds known mostly by their voices. Along the way I have coordinated urban birdwatching workshops, brought birds and bioacoustics into schools in the Sierra de Oaxaca, and worked in sea turtle and bird banding camps.
    es: |
      Soy doctorante en Ciencias en Conservación y Aprovechamiento de Recursos Naturales en el Instituto Politécnico Nacional (CIIDIR Unidad Oaxaca), donde trabajo en el **Laboratorio de Bioacústica y Ecología del Comportamiento**. Mi investigación une la ornitología, la bioacústica y el manejo de fauna silvestre: utilizo las vocalizaciones para entender cómo se comportan las aves nocturnas en los paisajes de montaña, y estudio la relación entre las aves silvestres y los agricultores cuyos cultivos consumen.

      Mi camino comenzó en la agroecología, continuó con el manejo de fauna silvestre en la costa de Oaxaca y hoy se centra en los tapacaminos, un grupo de aves nocturnas y crípticas que conocemos sobre todo por sus voces. En el camino he coordinado talleres de observación de aves urbanas, he llevado las aves y la bioacústica a escuelas de la Sierra de Oaxaca y he trabajado en campamentos tortugueros y de anillamiento de aves.

  # Optional photo shown beside the bio. Upload it to assets/img and put its
  # file name here, e.g.  image: "assets/img/harvard-mcz.jpg".
  # Leave image empty ("") to hide the photo.
  photo:
    image: "assets/img/harvard-mcz.jpg"
    alt:
      en: "Dayane examining bird specimens at a museum collection table."
      es: "Dayane revisando especímenes de aves en la mesa de una colección científica."
    caption:
      en: "Visiting researcher at Harvard University’s Museum of Comparative Zoology"
      es: "Investigadora visitante en el Museo de Zoología Comparada de la Universidad de Harvard"

  education_title: { en: "Education", es: "Formación académica" }
  education:
