# ---------------------------------------------------------------------
#  Research
# ---------------------------------------------------------------------
research:
  kicker: { en: "Research", es: "Investigación" }
  title:
    en: "Birds, sound and the people who live alongside them"
    es: "Aves, sonido y las personas que conviven con ellas"
  interests:
    - { en: "Bird ecology & conservation", es: "Ecología y conservación de aves" }
    - { en: "Bioacoustics & vocal activity", es: "Bioacústica y actividad vocal" }
    - { en: "Human–wildlife interactions", es: "Interacciones humano–fauna silvestre" }
    - { en: "Sustainable agriculture & biodiversity", es: "Agricultura sustentable y biodiversidad" }
    - { en: "Wildlife monitoring & data analysis", es: "Monitoreo de fauna silvestre y análisis de datos" }

  # The first project marked "featured: true" is shown large.
  projects:
    - featured: true
      label:
        en: "Doctoral research · IPN CIIDIR Oaxaca"
        es: "Investigación doctoral · IPN CIIDIR Oaxaca"
      title:
        en: "Voices of the night: nightjars in Oaxaca’s highlands"
        es: "Voces de la noche: tapacaminos en las montañas de Oaxaca"
      text:
        en: "Nightjars (Caprimulgidae) are hard to see but easy to hear. My doctoral research follows the vocal activity of two montane Neotropical nightjars along an altitudinal gradient in the mountains of Oaxaca, asking how elevation, moonlight and the availability of insect prey shape when and how much they sing. It builds on earlier work on the geographic variation and behavioural ecology of the Mexican Whip-poor-will (*Antrostomus arizonae*)."
        es: "Los tapacaminos (Caprimulgidae) son difíciles de ver, pero fáciles de escuchar. Mi investigación doctoral sigue la actividad vocal de dos especies de tapacaminos neotropicales de montaña a lo largo de un gradiente altitudinal en las montañas de Oaxaca, y se pregunta cómo la altitud, la luz de la luna y la disponibilidad de insectos presa determinan cuándo y cuánto cantan. Parte de trabajo previo sobre la variación geográfica y la ecología del comportamiento del tapacamino cuerporruín mexicano (*Antrostomus arizonae*)."
      questions:
        - { en: "How does vocal activity change with elevation?", es: "¿Cómo cambia la actividad vocal con la altitud?" }
        - { en: "How does moonlight shape nightly singing?", es: "¿Cómo influye la luz de la luna en el canto nocturno?" }
        - { en: "Does singing track the availability of prey?", es: "¿El canto sigue la disponibilidad de presas?" }
      tags:
        - { en: "Acoustic monitoring", es: "Monitoreo acústico" }
        - "BirdNET"
        - "Raven"
        - "Syrinx"
        - "R"

    - label:
        en: "Human–wildlife interactions · Oaxaca"
        es: "Interacciones humano–fauna · Oaxaca"
      title:
        en: "Birds, maize and farmers"
        es: "Aves, maíz y agricultores"
      text:
        en: "Some wild birds feed on maize, a staple crop across rural Oaxaca. I evaluated birds feeding on maize in Santa María Colotepec and the Sierra Madre del Sur, proposed management alternatives, and documented how farmers in the Costa region perceive these birds, a step towards coexistence that works for both people and wildlife."
        es: "Algunas aves silvestres se alimentan de maíz, un cultivo básico en el Oaxaca rural. Evalué las aves que consumen maíz en Santa María Colotepec y la Sierra Madre del Sur, propuse alternativas de manejo y documenté cómo perciben a estas aves los agricultores de la región Costa: un paso hacia una convivencia que funcione tanto para las personas como para la fauna."
      tags:
        - { en: "Social-ecological systems", es: "Sistemas socioecológicos" }
        - "ATLAS.ti"
        - { en: "Crop damage assessment", es: "Evaluación de daños a cultivos" }

    - label:
        en: "Early research · UASLP, San Luis Potosí"
        es: "Primeras investigaciones · UASLP, San Luis Potosí"
      title:
        en: "Roots in agroecology"
        es: "Raíces en la agroecología"
      text:
        en: "My first projects combined farming and wildlife: the breeding ecology of the Barn Swallow (*Hirundo rustica*) at UASLP’s Faculty of Agronomy and Veterinary Medicine, which won second place in the poster presentations at UASLP’s Week of Science in 2018, and the development of two bean varieties under heat stress."
        es: "Mis primeros proyectos unieron agricultura y fauna: la ecología reproductiva de la golondrina tijereta (*Hirundo rustica*) en la Facultad de Agronomía y Veterinaria de la UASLP, que obtuvo el segundo lugar en la presentación de carteles de la Semana de la Ciencia de la UASLP en 2018, y el desarrollo de dos variedades de frijol bajo estrés por calor."
      tags:
        - { en: "Breeding ecology", es: "Ecología reproductiva" }
        - { en: "Agroecology", es: "Agroecología" }

    - label:
        en: "Environmental education"
        es: "Educación ambiental"
      title:
        en: "Birds for everyone"
        es: "Aves para todas y todos"
      text:
        en: "I bring birds and bioacoustics into schools in the Sierra de Oaxaca, help create bird- and pollinator-friendly gardens, and have coordinated the Urban Bird Program (PAU) Ojo de Lumbre with CONABIO in San Luis Potosí, running workshops and talks on birdwatching and why birds matter."
        es: "Llevo las aves y la bioacústica a escuelas de la Sierra de Oaxaca, ayudo a crear jardines amigables para aves y polinizadores, y he coordinado el Programa de Aves Urbanas (PAU) Ojo de Lumbre con la CONABIO en San Luis Potosí, con talleres y pláticas sobre la observación de aves y su importancia."
      tags:
        - { en: "Community science", es: "Ciencia ciudadana" }
        - { en: "Outreach", es: "Divulgación" }

  toolkit_title: { en: "Toolkit", es: "Herramientas" }
  toolkit:
    - group: { en: "Bioacoustics", es: "Bioacústica" }
      items: ["Raven", "Avisoft", "Syrinx", "BirdNET"]
